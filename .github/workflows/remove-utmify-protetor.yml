name: Remove UTMify Protetor
on:
  push:
    paths:
      - '.github/workflows/remove-utmify-protetor.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remover UTMify do index.html
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          blocks = [
          '''  <script
            src="https://cdn.utmify.com.br/scripts/utms/latest.js"
            data-utmify-prevent-xcod-sck
            data-utmify-prevent-subids
            async
            defer
          ></script>

          ''',
          '''  <script>
            window.pixelId = "6a3af228cd6a58108c27902c";
            var a = document.createElement("script");
            a.setAttribute("async", "");
            a.setAttribute("defer", "");
            a.setAttribute("src", "https://cdn.utmify.com.br/scripts/pixel/pixel.js");
            document.head.appendChild(a);
          </script>

          ''',
          '''  <script>
            window.googlePixelId = "6a49c263bf29386f748b7a2d";
            var a = document.createElement("script");
            a.setAttribute("async", "");
            a.setAttribute("defer", "");
            a.setAttribute("src", "https://cdn.utmify.com.br/scripts/pixel/pixel-google.js");
            document.head.appendChild(a);
          </script>
'''
          ]
          for block in blocks:
              s = s.replace(block, '')
          p.write_text(s)
          PY
          rm .github/workflows/remove-utmify-protetor.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/remove-utmify-protetor.yml
          git commit -m "Remove UTMify do Protetor FPS 70"
          git push