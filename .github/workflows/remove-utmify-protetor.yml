name: Remove UTMify Protetor
on:
  push:
    paths:
      - '.github/workflows/remove-utmify-protetor.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remover UTMify
        run: python3 .github/remove_utmify.py
      - name: Commitar alteração
        run: |
          rm .github/remove_utmify.py
          rm .github/workflows/remove-utmify-protetor.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/remove_utmify.py .github/workflows/remove-utmify-protetor.yml
          git commit -m "Remove UTMify do Protetor FPS 70"
          git push