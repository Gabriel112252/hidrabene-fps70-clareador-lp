name: Fix direct checkout Protetor
on:
  push:
    paths:
      - '.github/workflows/fix-direct-checkout-protetor.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trocar botoes pelos links Insight reais
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          replacements = {
            '<button class="cta-primary kit-cta" onclick="comprarAgora(\'1-unidade\')">Comprar 1 unidade</button>': '<a class="cta-primary kit-cta" href="https://insight.hidrabene.com.br/click/1">Comprar 1 unidade</a>',
            '<button class="cta-primary kit-cta" onclick="comprarAgora(\'2-unidades\')">Comprar 2 unidades</button>': '<a class="cta-primary kit-cta" href="https://insight.hidrabene.com.br/click/2">Comprar 2 unidades</a>',
            '<button class="cta-primary kit-cta" onclick="comprarAgora(\'3-unidades\')">Comprar 3 unidades</button>': '<a class="cta-primary kit-cta" href="https://insight.hidrabene.com.br/click/3">Comprar 3 unidades</a>',
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'Nao achei trecho esperado: {old}')
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Commitar alteracao
        run: |
          rm .github/workflows/fix-direct-checkout-protetor.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/fix-direct-checkout-protetor.yml
          git commit -m "Corrige links reais dos checkouts do Protetor FPS 70"
          git push
