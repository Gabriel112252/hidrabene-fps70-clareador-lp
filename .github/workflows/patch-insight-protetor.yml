name: Patch Insight Protetor
on:
  push:
    paths:
      - '.github/workflows/patch-insight-protetor.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Atualizar index.html
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          replacements = {
              'https://hidrabene.pay.yampi.com.br/r/FQH20J70UC': 'https://insight.hidrabene.com.br/click/1',
              'https://hidrabene.pay.yampi.com.br/r/524DBLU40W': 'https://insight.hidrabene.com.br/click/2',
              'https://hidrabene.pay.yampi.com.br/r/KIAU1RFFXS': 'https://insight.hidrabene.com.br/click/3',
          }
          for old, new in replacements.items():
              s = s.replace(old, new)
          script = '<script src="https://insight.hidrabene.com.br/uniclick.js?attribution=lastpaid&cookiedomain=hidrabene.com.br&cookieduration=90&defaultcampaignid=6aa2f755818faec5cb6874a2&regviewonce=false&rtkcidurl=true&script_id=6aa2f88e1044a350a10f243d"></script>'
          if script not in s:
              s = s.replace('</head>', f'  {script}\n</head>', 1)
          p.write_text(s)
          PY
          rm .github/workflows/patch-insight-protetor.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/patch-insight-protetor.yml
          git commit -m "Configura Insight e checkouts do Protetor FPS 70"
          git push