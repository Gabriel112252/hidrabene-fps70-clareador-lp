name: Update checkout links

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-checkout-links:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update checkout URLs
        shell: python
        run: |
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          replacements = {
              'href="https://insight.hidrabene.com.br/click/3">Comprar 3 unidades': 'href="https://insight.hidrabene.com.br/click/2">Comprar 3 unidades',
              'href="https://seguro.hidrabene.com.br/r/MSF007U0ZQ">Comprar 6 unidades': 'href="https://insight.hidrabene.com.br/click/3">Comprar 6 unidades',
              "'3-unidades': 'https://insight.hidrabene.com.br/click/3'": "'3-unidades': 'https://insight.hidrabene.com.br/click/2'",
              "'6-unidades': 'https://seguro.hidrabene.com.br/r/MSF007U0ZQ'": "'6-unidades': 'https://insight.hidrabene.com.br/click/3'",
          }

          for old, new in replacements.items():
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly 1 occurrence of {old!r}, found {count}')
              s = s.replace(old, new)

          p.write_text(s, encoding='utf-8')

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "fix: update checkout links for 1, 3 and 6 units"
          git push
