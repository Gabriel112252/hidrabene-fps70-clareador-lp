name: Add RT clickid patch
on:
  push:
    paths:
      - '.github/workflows/add-rt-clickid-patch.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inserir patch RT apos Uniclick
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text()
          if 'var RT_CONFIG = {' in s:
              raise SystemExit('Patch RT ja existe')

          patch = r'''<script>
(function () {
  /* ============ RT_CONFIG (unico lugar com variaveis) ============ */
  var RT_CONFIG = {
    TRACK_HOST: 'insight.hidrabene.com.br', // host do /click (sem https, sem barra)
    CLICKID_RE: '[a-f0-9]{24}'              // formato do clickid RT
  };
  /* ================================================================ */

  function getClickId() {
    try {
      var re = new RegExp('[?&]rtkcid=(' + RT_CONFIG.CLICKID_RE + ')', 'i');
      var m = window.location.search.match(re);
      if (m) return m[1];
      var c = document.cookie.match(new RegExp('(?:^|;\\s*)rtkclickid-store=(' + RT_CONFIG.CLICKID_RE + ')', 'i'));
      if (c) return c[1];
      var s = null;
      try { s = sessionStorage.getItem('rtkclickid'); } catch (e) {}
      if (s && new RegExp('^' + RT_CONFIG.CLICKID_RE + '$', 'i').test(s)) return s;
    } catch (e) {}
    return null;
  }

  function patch() {
    var cid = getClickId();
    if (!cid) return 0;
    var n = 0;
    var sels = 'a[href*="' + RT_CONFIG.TRACK_HOST + '/click"], a[href*="/click/"], a[href$="/click"]';
    document.querySelectorAll(sels).forEach(function (a) {
      try {
        if (a.href.indexOf('clickid=') !== -1) return;
        var u = new URL(a.href, window.location.origin);
        u.searchParams.set('clickid', cid);
        a.href = u.toString();
        n++;
      } catch (e) {}
    });
    return n;
  }

  // O cookie nasce async (XHR do uniclick.js) — tenta por ~8s.
  var tries = 0;
  var iv = setInterval(function () {
    tries++;
    var n = patch();
    if (n > 0 || tries >= 16) {
      clearInterval(iv);
      try { console.info('[RT] clickid patch: ' + n + ' CTA(s)'); } catch (e) {}
    }
  }, 500);

  // Ultima chance: reescreve no momento do clique (captura).
  document.addEventListener('click', function (e) {
    var a = e.target && e.target.closest ? e.target.closest('a[href*="/click"]') : null;
    if (!a || a.href.indexOf('clickid=') !== -1) return;
    var cid = getClickId();
    if (!cid) return;
    try {
      var u = new URL(a.href, window.location.origin);
      u.searchParams.set('clickid', cid);
      a.href = u.toString();
    } catch (err) {}
  }, true);
})();
</script>'''

          pat = re.compile(r'(<script\b[^>]*\bsrc=["\']https://insight\.hidrabene\.com\.br/uniclick\.js\?[^"\']+["\'][^>]*>\s*</script>)', re.I)
          s2, n = pat.subn(lambda m: m.group(1) + '\n' + patch, s, count=1)
          if n != 1:
              raise SystemExit('Nao achei a tag uniclick.js')
          p.write_text(s2)
          PY

          rm .github/workflows/add-rt-clickid-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/add-rt-clickid-patch.yml
          git commit -m "Adiciona patch RT de clickid apos Uniclick"
          git push
