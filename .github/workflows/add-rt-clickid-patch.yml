name: Add RT clickid patch
on:
  push:
    paths:
      - '.github/workflows/add-rt-clickid-patch.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inserir patch RT apos Uniclick
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          p = Path('index.html')
          s = p.read_text()
          if 'var RT_CONFIG = {' not in s:
              i = s.find('https://insight.hidrabene.com.br/uniclick.js?')
              if i < 0:
                  raise SystemExit('Nao achei uniclick.js')
              j = s.find('</script>', i)
              if j < 0:
                  raise SystemExit('Nao achei fechamento da tag Uniclick')
              j += len('</script>')
              patch = base64.b64decode('').decode()
              s = s[:j] + '\n' + patch + s[j:]
              p.write_text(s)
          PY
          rm .github/workflows/add-rt-clickid-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/add-rt-clickid-patch.yml
          git commit -m "Adiciona patch RT de clickid apos Uniclick"
          git push
